<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F1915" />
    <title>Maison Sable — Custom Furniture, Made to Measure</title>
    <meta name="description" content="Maison Sable designs and builds made-to-measure sofas, beds, dining tables and storage in solid wood and natural fabrics. Explore designs and request a custom quote." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/img/r/hero-living.webp" fetchpriority="high" />
    <script>
      // Branded intro plays once per session; later visits and navigations skip it.
      try { if (sessionStorage.getItem('ms:intro')) document.documentElement.classList.add('ms-skip-intro'); } catch (e) {}
    </script>
    <style>
      #ms-loader {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: #1f1915; color: #f3ece1; font-family: 'Fraunces Variable', 'Fraunces', Georgia, serif;
        transition: transform 1s cubic-bezier(0.76, 0, 0.24, 1);
      }
      .ms-skip-intro #ms-loader { display: none; }
      #ms-loader.is-leaving { transform: translateY(-100%); }
      #ms-loader .l-inner { display: grid; justify-items: center; gap: 18px; transition: opacity 0.5s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
      #ms-loader.is-leaving .l-inner { opacity: 0; transform: translateY(-40px); }
      #ms-loader .l-mark { width: 44px; height: 44px; opacity: 0; animation: l-fade 0.8s 0.1s ease forwards; }
      #ms-loader .l-mark { color: #f3ece1; }
      #ms-loader .l-word { display: flex; gap: 0; font-size: clamp(2rem, 6vw, 3rem); font-weight: 400; letter-spacing: -0.02em; overflow: hidden; padding: 0.06em 0.05em 0.16em; line-height: 1; }
      #ms-loader .l-word span { display: inline-block; transform: translateY(110%); animation: l-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #ms-loader .l-word .s { color: #a8714c; font-weight: 400; font-style: italic; }
      #ms-loader .l-tag { font-family: 'Figtree Variable', 'Figtree', system-ui, sans-serif; font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(243, 236, 225, 0.6); opacity: 0; animation: l-fade 0.8s 0.9s ease forwards; }
      #ms-loader .l-bar { position: absolute; left: 50%; bottom: 14vh; width: min(220px, 50vw); height: 1px; transform: translateX(-50%); background: rgba(243, 236, 225, 0.16); overflow: hidden; }
      #ms-loader .l-bar i { position: absolute; inset: 0; background: #c9b9a0; transform-origin: left; transform: scaleX(0); animation: l-load 1.8s cubic-bezier(0.3, 0.6, 0.2, 1) forwards; }
      #ms-loader.is-ready .l-bar i { animation: none; transform: scaleX(1); transition: transform 0.35s ease; }
      @keyframes l-rise { to { transform: translateY(0); } }
      @keyframes l-fade { to { opacity: 1; } }
      @keyframes l-load { to { transform: scaleX(0.86); } }
      @media (prefers-reduced-motion: reduce) {
        #ms-loader, #ms-loader * { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="ms-loader" role="status" aria-label="Loading Maison Sable">
      <div class="l-inner">
        <svg class="l-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><rect x="0.75" y="0.75" width="30.5" height="30.5" rx="4" stroke-width="1.3" /><path d="M10.5 24.5V15a5.5 5.5 0 0 1 11 0v9.5" stroke-width="1.6" /><path d="M7.5 24.5h17" stroke-width="1.6" /><path d="M13.5 19.5h5" stroke-width="1.4" /></svg>
        <div class="l-word" aria-hidden="true">
          <span style="animation-delay:.15s">M</span><span style="animation-delay:.2s">a</span><span style="animation-delay:.25s">i</span><span style="animation-delay:.3s">s</span><span style="animation-delay:.35s">o</span><span style="animation-delay:.4s">n</span>
          <span class="s" style="animation-delay:.5s;margin-left:.24em">S</span><span class="s" style="animation-delay:.55s">a</span><span class="s" style="animation-delay:.6s">b</span><span class="s" style="animation-delay:.65s">l</span><span class="s" style="animation-delay:.7s">e</span>
        </div>
        <p class="l-tag">Furniture, made to measure</p>
      </div>
      <div class="l-bar" aria-hidden="true"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
